name: Apple CI (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'JSON runner label array for a self-hosted macOS runner.'
        type: string
        default: '["self-hosted","macOS","ARM64","ios"]'
      working-directory:
        description: 'Directory containing the XcodeGen/Xcode project or Package.swift.'
        type: string
        default: "."
      build-system:
        description: 'Build mode: xcodebuild or swift-package.'
        type: string
        default: "xcodebuild"
      xcodegen:
        description: 'Run xcodegen generate before building.'
        type: boolean
        default: true
      project:
        description: 'Xcode project path relative to working-directory.'
        type: string
        default: ""
      scheme:
        description: 'Xcode scheme to build. Defaults to working-directory basename.'
        type: string
        default: ""
      destination:
        description: 'xcodebuild destination used for compile-only jobs.'
        type: string
        default: "generic/platform=iOS Simulator"
      test-destination:
        description: 'Optional xcodebuild test destination. Empty selects the first available iPhone simulator.'
        type: string
        default: ""
      xcode-select:
        description: 'Optional DEVELOPER_DIR, e.g. /Applications/Xcode.app/Contents/Developer.'
        type: string
        default: ""
      homebrew-prefix:
        description: 'Homebrew prefix to add to PATH for launchd-based runners.'
        type: string
        default: "/opt/homebrew/bin"
      run-tests:
        description: 'Run XCTest or Swift Package tests. XCTest includes the simulator build.'
        type: boolean
        default: true
      swift-build-command:
        description: 'Swift Package build command.'
        type: string
        default: "swift build"
      swift-test-command:
        description: 'Swift Package test command.'
        type: string
        default: "swift test"

permissions:
  contents: read

jobs:
  build:
    name: Apple build
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated build paths
        run: |
          repo_name="${GITHUB_REPOSITORY##*/}"
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/oakfarm-derived-data/${repo_name}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "RESULT_BUNDLE_PATH=$RUNNER_TEMP/oakfarm-test-results/${repo_name}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.xcresult" >> "$GITHUB_ENV"

      - name: Add Homebrew to PATH
        if: inputs.homebrew-prefix != ''
        run: echo "${{ inputs.homebrew-prefix }}" >> "$GITHUB_PATH"

      - name: Select Xcode
        if: inputs.xcode-select != ''
        run: echo "DEVELOPER_DIR=${{ inputs.xcode-select }}" >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Ensure XcodeGen is available
        if: inputs.build-system == 'xcodebuild' && inputs.xcodegen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        if: inputs.build-system == 'xcodebuild' && inputs.xcodegen
        run: xcodegen generate

      - name: Resolve Xcode project and scheme
        id: xcode
        if: inputs.build-system == 'xcodebuild'
        env:
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_SCHEME: ${{ inputs.scheme }}
        run: |
          set -euo pipefail

          project="$INPUT_PROJECT"
          if [ -z "$project" ]; then
            shopt -s nullglob
            projects=( *.xcodeproj )
            if [ "${#projects[@]}" -ne 1 ]; then
              echo "::error::Set input project when working-directory does not contain exactly one .xcodeproj"
              exit 1
            fi
            project="${projects[0]}"
          fi

          scheme="$INPUT_SCHEME"
          if [ -z "$scheme" ]; then
            scheme="$(basename "$PWD")"
          fi

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Build for simulator (no code signing)
        if: inputs.build-system == 'xcodebuild' && inputs.run-tests == false
        run: |
          set -euo pipefail
          mkdir -p "$DERIVED_DATA_PATH"
          xcodebuild build \
            -project '${{ steps.xcode.outputs.project }}' \
            -scheme '${{ steps.xcode.outputs.scheme }}' \
            -destination '${{ inputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Test Xcode scheme
        if: inputs.build-system == 'xcodebuild' && inputs.run-tests
        env:
          INPUT_TEST_DESTINATION: ${{ inputs.test-destination }}
        run: |
          set -euo pipefail

          destination="$INPUT_TEST_DESTINATION"
          if [ -z "$destination" ]; then
            sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
            runtime_identifier="$(xcrun simctl list runtimes available -j | \
              SDK_VERSION="$sdk_version" python3 -c '
          import json, sys
          import os
          payload = json.load(sys.stdin)
          for runtime in payload.get("runtimes", []):
              if runtime.get("isAvailable") and runtime.get("version") == os.environ["SDK_VERSION"]:
                  print(runtime["identifier"])
                  raise SystemExit(0)
          raise SystemExit(f"No available iOS Simulator runtime matches SDK {os.environ['"'"'SDK_VERSION'"'"']}")
          ')"
            udid="$(xcrun simctl list devices available -j | \
              RUNTIME_IDENTIFIER="$runtime_identifier" python3 -c '
          import json, os, sys
          payload = json.load(sys.stdin)
          for device in payload.get("devices", {}).get(os.environ["RUNTIME_IDENTIFIER"], []):
              if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                  print(device["udid"])
                  raise SystemExit(0)
          raise SystemExit("No available iPhone found for the selected Xcode SDK")
          ')"
            destination="platform=iOS Simulator,id=$udid"
          fi

          mkdir -p "$DERIVED_DATA_PATH" "$(dirname "$RESULT_BUNDLE_PATH")"
          rm -rf "$RESULT_BUNDLE_PATH"
          xcodebuild test \
            -project '${{ steps.xcode.outputs.project }}' \
            -scheme '${{ steps.xcode.outputs.scheme }}' \
            -destination "$destination" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload XCTest result bundle
        if: always() && inputs.build-system == 'xcodebuild' && inputs.run-tests
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-xctest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_BUNDLE_PATH }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Swift Package
        if: inputs.build-system == 'swift-package'
        run: ${{ inputs.swift-build-command }}

      - name: Test Swift Package
        if: inputs.build-system == 'swift-package' && inputs.run-tests
        run: ${{ inputs.swift-test-command }}

      - name: Clean transient Apple build data
        if: always()
        run: |
          set -euo pipefail
          case "$DERIVED_DATA_PATH" in
            "$RUNNER_TEMP"/oakfarm-derived-data/*) rm -rf "$DERIVED_DATA_PATH" ;;
            *) echo "::error::Refusing unsafe cleanup path: $DERIVED_DATA_PATH"; exit 1 ;;
          esac
