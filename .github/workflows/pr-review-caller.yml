name: PR Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, review_requested]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    uses: Boothey07/ci-pr-reviewer/.github/workflows/pr-review.yml@v5
    with:
      runs-on: '["self-hosted","linux","x64","vps","ci"]'
      mark-ready: true
      auto-merge: true
      auto-fix: true
    secrets:
      reviewer_app_id: ${{ secrets.REVIEWER_APP_ID }}
      reviewer_app_private_key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
