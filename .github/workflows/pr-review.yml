name: PR Review (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: "JSON runner label array"
        type: string
        default: '["ubuntu-latest"]'
      model:
        description: "LiteLLM gateway model name"
        type: string
        default: "openai/pr-review-minimax"
      api-base:
        description: "LiteLLM gateway endpoint reachable from the runner"
        type: string
        default: "http://127.0.0.1:4000/v1"
      pr-agent-version:
        description: "Pinned PR-Agent package version"
        type: string
        default: "0.39.0"
      mark-ready:
        description: "Mark a draft PR ready after a successful review"
        type: boolean
        default: true
    secrets:
      llm-api-key:
        required: false
      reviewer-token:
        description: "Dedicated bot PAT; superseded by the GitHub App secrets"
        required: false
      reviewer-app-id:
        description: "GitHub App ID for the reviewer bot"
        required: false
      reviewer-app-private-key:
        description: "GitHub App private key for the reviewer bot"
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Local PR review
    # Review comments are advisory; a model/runner outage must not block merges
    # or create another CI-failure email storm.
    continue-on-error: true
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PR-Agent
        run: python -m pip install --disable-pip-version-check "pr-agent==${{ inputs.pr-agent-version }}"

      - name: Create reviewer GitHub App token
        id: reviewer-app-token
        if: ${{ secrets['reviewer-app-id'] != '' && secrets['reviewer-app-private-key'] != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets['reviewer-app-id'] }}
          private-key: ${{ secrets['reviewer-app-private-key'] }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Verify local model is available
        env:
          CONFIG_MODEL: ${{ inputs.model }}
          LITELLM_API_BASE: ${{ inputs.api-base }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$LITELLM_API_BASE/models" \
            | jq -e --arg model "$CONFIG_MODEL" \
              '.data | any(.id == $model or .id == ($model | sub("^openai/"; "")))' >/dev/null

      - name: Review pull request with local model
        env:
          GITHUB_TOKEN: ${{ steps.reviewer-app-token.outputs.token || secrets['reviewer-token'] || github.token }}
          OPENAI_KEY: ${{ secrets.llm-api-key }}
          CONFIG_MODEL: ${{ inputs.model }}
          OPENAI_API_BASE: ${{ inputs.api-base }}
          OPENAI_API_KEY: ${{ secrets['llm-api-key'] }}
          OPENAI__API_BASE: ${{ inputs.api-base }}
          OPENAI__KEY: ${{ secrets['llm-api-key'] }}
          CONFIG_CUSTOM_MODEL_MAX_TOKENS: "8192"
          CONFIG_FALLBACK_MODELS: "[]"
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_URL"
          env \
            "config.model=$CONFIG_MODEL" \
            "config.custom_model_max_tokens=$CONFIG_CUSTOM_MODEL_MAX_TOKENS" \
            "config.fallback_models=$CONFIG_FALLBACK_MODELS" \
            pr-agent --pr_url "$PR_URL" review

      - name: Mark reviewed PR ready
        if: inputs.mark-ready && github.event.pull_request.draft == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            -d '{"draft":false}' >/dev/null
