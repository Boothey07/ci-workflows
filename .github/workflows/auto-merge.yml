name: Auto-merge (reusable)

on:
  workflow_call:
    inputs:
      pr-number:
        description: "Pull request number"
        type: number
        required: true
      head-sha:
        description: "Expected pull request head SHA"
        type: string
        required: true
      runs-on:
        description: "Runner label"
        type: string
        default: "ubuntu-latest"
      required-check:
        description: "Single aggregate check that must pass before merge"
        type: string
        default: "Quality Gate / Quality Gate"
    secrets:
      reviewer_app_id:
        required: false
      reviewer_app_private_key:
        required: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge:
    name: Auto-merge
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Create reviewer App token
        id: reviewer-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.reviewer_app_id }}
          private-key: ${{ secrets.reviewer_app_private_key }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read

      - name: Validate merge policy
        id: policy
        env:
          GH_TOKEN: ${{ steps.reviewer-app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ inputs.head-sha }}
          REQUIRED_CHECK: ${{ inputs.required-check }}
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR")
          author=$(jq -r '.user.login' <<< "$pr")
          draft=$(jq -r '.draft' <<< "$pr")
          head=$(jq -r '.head.sha' <<< "$pr")
          state=$(jq -r '.state' <<< "$pr")
          labels=$(jq -r '[.labels[].name] | join(",")' <<< "$pr")

          if [ "$state" != "open" ] || [ "$author" != "$OWNER" ] || [ "$draft" != "false" ] || [ "$head" != "$SHA" ]; then
            echo "merge gate inactive: state=$state author=$author draft=$draft head=$head"
            exit 0
          fi
          if ! jq -e '[.labels[].name] | contains(["automerge", "reviewer-ready"])' <<< "$pr" >/dev/null; then
            echo "merge gate waiting for reviewer labels: $labels"
            exit 0
          fi

          reviews=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" --slurp)
          approved=$(jq -r --arg sha "$SHA" \
            'flatten | any(.state == "APPROVED" and .commit_id == $sha and (.user.login | startswith("ci-review-bot")))' \
            <<< "$reviews")
          if [ "$approved" != "true" ]; then
            echo "merge gate waiting for a current ci-review-bot approval"
            exit 0
          fi

          checks=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs" --slurp)
          check=$(jq -c --arg required "$REQUIRED_CHECK" \
            'flatten | map(.check_runs[]) | map(select(.name == $required)) | last // {}' \
            <<< "$checks")
          status=$(jq -r '.status // "missing"' <<< "$check")
          conclusion=$(jq -r '.conclusion // ""' <<< "$check")
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "merge gate waiting for $REQUIRED_CHECK: $status/$conclusion"
            exit 0
          fi

          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Squash merge
        if: steps.policy.outputs.validated == 'true'
        env:
          GH_TOKEN: ${{ steps.reviewer-app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
          SHA: ${{ inputs.head-sha }}
        run: gh pr merge "$PR" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA"
