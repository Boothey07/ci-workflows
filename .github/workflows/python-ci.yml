name: Python CI (reusable)

# Central Python CI. Consumers call this with ~8 lines; see templates/ci.yml.
# Deliberately triggered by the CALLER on pull_request only — never on push too,
# which would double-bill every PR.

on:
  workflow_call:
    inputs:
      paths:
        description: 'Space-separated paths to lint/compile (e.g. "api/ tools/"). Defaults to the repo root.'
        type: string
        default: "."
      working-directory:
        description: 'Directory containing the Python project.'
        type: string
        default: "."
      lint-paths:
        description: 'Paths passed to ruff. Defaults to paths.'
        type: string
        default: ""
      ruff-select:
        description: 'Optional comma-separated Ruff rule selection for a staged baseline.'
        type: string
        default: ""
      ruff-extend-select:
        description: 'Optional comma-separated Ruff rules added to the project configuration.'
        type: string
        default: ""
      ruff-ignore:
        description: 'Optional comma-separated Ruff rules ignored for this consumer.'
        type: string
        default: ""
      python-versions:
        description: 'JSON array of Python versions for the compile matrix.'
        type: string
        default: '["3.12"]'
      runs-on:
        description: 'JSON runner label array. Use ["self-hosted","linux","vps"] to stay off billed minutes.'
        type: string
        default: '["ubuntu-latest"]'
      ruff-version:
        description: 'Pinned ruff version. Pinned so a ruff release cannot turn CI red on its own.'
        type: string
        default: "0.15.21"
      run-tests:
        description: 'Run pytest. Only enable where tests actually exist — a vacuous gate is worse than none.'
        type: boolean
        default: false
      test-command:
        description: 'Test command, when run-tests is true.'
        type: string
        default: "pytest -q"
      install-command:
        description: 'Dependency install, when run-tests is true (e.g. pip install -e ".[dev]").'
        type: string
        default: ""
      coverage-threshold:
        description: 'Fail under this coverage %. 0 disables.'
        type: number
        default: 0
      coverage-source:
        description: 'Source package passed to pytest-cov.'
        type: string
        default: ""
      strict-types:
        description: 'Make mypy blocking. Off by default: a wall of red on untyped code trains you to ignore CI.'
        type: boolean
        default: false
      strict-format:
        description: >-
          Make `ruff format --check` blocking. Off by default for the same reason as
          strict-types: existing repos are not format-clean, and a gate that is red
          from day one on pre-existing code gets ignored rather than fixed. Turn this
          on per-repo once its history has been formatted in a dedicated commit.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==${{ inputs.ruff-version }}"
      - name: ruff check
        working-directory: ${{ inputs.working-directory }}
        env:
          LINT_PATHS: ${{ inputs.lint-paths || inputs.paths }}
          RUFF_SELECT: ${{ inputs.ruff-select }}
          RUFF_EXTEND_SELECT: ${{ inputs.ruff-extend-select }}
          RUFF_IGNORE: ${{ inputs.ruff-ignore }}
        run: |
          args=(--output-format=github)
          [ -n "$RUFF_SELECT" ] && args+=(--select "$RUFF_SELECT")
          [ -n "$RUFF_EXTEND_SELECT" ] && args+=(--extend-select "$RUFF_EXTEND_SELECT")
          [ -n "$RUFF_IGNORE" ] && args+=(--ignore "$RUFF_IGNORE")
          ruff check "${args[@]}" $LINT_PATHS

  format:
    name: Format${{ inputs.strict-format && '' || ' (advisory)' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    continue-on-error: ${{ !inputs.strict-format }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==${{ inputs.ruff-version }}"
      - name: ruff format --check
        working-directory: ${{ inputs.working-directory }}
        run: |
          if ruff format --check --diff ${{ inputs.paths }}; then
            exit 0
          fi
          if [ "${{ inputs.strict-format }}" = "true" ]; then
            echo "::error::Formatting differs. Run: ruff format ${{ inputs.paths }}"
            exit 1
          fi
          echo "::warning::Formatting differs — advisory only. Run: ruff format ${{ inputs.paths }}"
          echo "Set strict-format: true once this repo has been formatted."

  compile:
    name: Compile (py${{ matrix.python }})
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile every module
        working-directory: ${{ inputs.working-directory }}
        run: python -m compileall -q ${{ inputs.paths }}

  test:
    name: Test
    if: inputs.run-tests
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          if [ -n "$INSTALL_COMMAND" ]; then
            bash -lc "$INSTALL_COMMAND"
          else
            pip install pytest pytest-cov
          fi
      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ "${{ inputs.coverage-threshold }}" != "0" ]; then
            coverage_args=(--cov-report=term-missing --cov-fail-under=${{ inputs.coverage-threshold }})
            [ -n "${{ inputs.coverage-source }}" ] && coverage_args+=(--cov="${{ inputs.coverage-source }}")
            ${{ inputs.test-command }} "${coverage_args[@]}"
          else
            ${{ inputs.test-command }}
          fi

  types:
    name: Types (advisory)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    continue-on-error: ${{ !inputs.strict-types }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy
      - name: mypy
        working-directory: ${{ inputs.working-directory }}
        run: |
          if mypy --ignore-missing-imports --no-error-summary ${{ inputs.paths }}; then
            exit 0
          fi
          if [ "${{ inputs.strict-types }}" = "true" ]; then
            exit 1
          fi
          echo "advisory only — not blocking"

  audit:
    name: Dependency audit (advisory)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit
        working-directory: ${{ inputs.working-directory }}
        run: |
          shopt -s nullglob
          reqs=(requirements*.txt)
          if [ ${#reqs[@]} -gt 0 ]; then
            for r in "${reqs[@]}"; do pip-audit -r "$r" || true; done
          elif [ -f pyproject.toml ]; then
            pip-audit || true
          else
            echo "no dependency manifest — nothing to audit"
          fi
